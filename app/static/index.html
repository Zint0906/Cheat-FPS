<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#080b10"
    >

    <title>CHEAT FPS</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

<div id="app">


    <!-- ================================================== -->
    <!-- MAIN MENU -->
    <!-- ================================================== -->

    <section
        id="menu"
        class="screen"
    >

        <div class="menu-inner">

            <h1>
                CHEAT
                <span>FPS</span>
            </h1>

            <p>
                핵이 규칙인 3 VS 3 서바이벌
            </p>


            <div class="menu-buttons">

                <button
                    data-mode="ai"
                    class="primary"
                >
                    AI전
                </button>


                <button
                    data-mode="local"
                >
                    로컬 플레이
                </button>


                <button
                    id="settingsBtn"
                >
                    설정
                </button>

            </div>


            <!-- 설정 -->

            <div
                id="settings"
                class="panel hidden"
            >

                <label>
                    감도

                    <input
                        id="sens"
                        type="range"
                        min="0.5"
                        max="2"
                        step="0.1"
                        value="1"
                    >

                </label>


                <p>
                    PC:
                    WASD 이동 ·
                    마우스 조준 ·
                    클릭 사격
                </p>


                <p>
                    모바일:
                    가상 스틱 ·
                    오른쪽 드래그 조준 ·
                    FIRE
                </p>

            </div>

        </div>

    </section>



    <!-- ================================================== -->
    <!-- LOBBY -->
    <!-- ================================================== -->

    <section
        id="lobby"
        class="screen hidden"
    >

        <div class="lobby-inner">

            <h2>
                TEAM SELECT
            </h2>


            <p id="modeText">
                게임 모드
            </p>


            <div class="teamgrid">


                <!-- TEAM A -->

                <div class="team-box">

                    <h3>
                        TEAM A
                    </h3>

                    <div id="teamA">
                    </div>

                </div>


                <!-- TEAM B -->

                <div class="team-box">

                    <h3>
                        TEAM B
                    </h3>

                    <div id="teamB">
                    </div>

                </div>


            </div>



            <!-- ================================================== -->
            <!-- LOADOUT -->
            <!-- ================================================== -->

            <div class="loadout panel">

                <b>
                    CHEAT LOADOUT
                </b>


                <label>

                    <input
                        type="checkbox"
                        data-cheat="aim"
                    >

                    에임핵

                </label>


                <label>

                    <input
                        type="checkbox"
                        data-cheat="esp"
                    >

                    ESP

                </label>


                <label>

                    <input
                        type="checkbox"
                        data-cheat="norecoil"
                    >

                    무반동

                </label>


                <label>

                    <input
                        type="checkbox"
                        data-cheat="infinite"
                    >

                    무한탄창

                </label>

            </div>



            <!-- ================================================== -->
            <!-- BUTTONS -->
            <!-- ================================================== -->

            <div class="lobby-buttons">

                <button
                    id="ready"
                    class="primary"
                >
                    전투 참가
                </button>


                <button
                    id="back"
                >
                    뒤로
                </button>

            </div>

        </div>

    </section>



    <!-- ================================================== -->
    <!-- GAME -->
    <!-- ================================================== -->

    <section
        id="game"
        class="screen hidden"
    >

        <canvas
            id="view"
        ></canvas>


        <!-- ================================================== -->
        <!-- HUD -->
        <!-- ================================================== -->

        <div id="hud">


            <div class="top">

                <span id="round">
                    ROUND 0/5
                </span>


                <span id="score">
                    0 : 0
                </span>


                <span id="timer">
                    LOBBY
                </span>

            </div>


            <div
                id="cross"
            >
                +
            </div>


            <div
                id="hp"
            >
                HP 100
            </div>


            <div
                id="cheats"
            >
                CHEATS OFF
            </div>


            <div
                id="alive"
            >
                A 0 — 0 B
            </div>


            <div
                id="log"
            ></div>


        </div>



        <!-- ================================================== -->
        <!-- MOBILE -->
        <!-- ================================================== -->

        <div id="mobile">


            <!-- 이동 스틱 -->

            <div
                id="stick"
                class="joystick"
            >

                <i></i>

            </div>


            <!-- 조준 영역 -->

            <div
                id="look"
                class="look-area"
            >
            </div>


            <!-- 발사 -->

            <button
                id="fire"
                class="fire-button"
            >
                FIRE
            </button>


            <!-- 모바일 치트 -->

            <button
                class="ct"
                data-cheat="aim"
            >
                AIM
            </button>


            <button
                class="ct"
                data-cheat="esp"
            >
                ESP
            </button>


            <button
                class="ct"
                data-cheat="norecoil"
            >
                NR
            </button>


            <button
                class="ct"
                data-cheat="infinite"
            >
                INF
            </button>


        </div>

    </section>



    <!-- ================================================== -->
    <!-- RESULT -->
    <!-- ================================================== -->

    <section
        id="result"
        class="screen hidden"
    >

        <div class="result-inner">

            <h1 id="resultTitle">
                MATCH COMPLETE
            </h1>


            <div
                id="resultStats"
            >
                최종 결과
            </div>


            <button
                id="again"
                class="primary"
            >
                다시 하기
            </button>


            <button
                id="home"
            >
                메인 메뉴
            </button>

        </div>

    </section>


</div>


<!-- ====================================================== -->
<!-- GAME JS -->
<!-- ====================================================== -->

<script
    src="/static/game.js"
></script>


</body>

</html>
